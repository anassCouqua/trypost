name: Keep TryPost Awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Wake TryPost
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            https://trypost-5g6o.onrender.com/health.php \
            >/dev/null
          echo "TryPost heartbeat OK"
